<!doctype html>
<meta charset="utf-8">
<title>L6_UI_BASELINE</title>
<body>
<div id="phase">L6_UI_BASELINE</div>
<div id="nodes"></div>
<script>
"use strict";

let retained = [];
location.hash = "L6_UI_BASELINE";
console.log("L6_UI_BASELINE");

setTimeout(function () {
  const nodes = document.getElementById("nodes");
  for (let i = 0; i < 240000; ++i) {
    retained.push({
      id: i,
      text: ("l6-ui-item-" + i + "-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx").repeat(4),
      values: [i, i + 1, i + 2, i + 3, i + 4, i + 5]
    });
  }
  for (let i = 0; i < 40000; ++i) {
    const node = document.createElement("span");
    node.textContent = "l6-ui-node-" + i;
    nodes.appendChild(node);
  }
  document.getElementById("phase").textContent = "L6_UI_HEAVY";
  document.title = "L6_UI_HEAVY";
  location.hash = "L6_UI_HEAVY";
  console.log("L6_UI_HEAVY");
}, 5000);

setTimeout(function () {
  document.title = "L6_UI_NAVIGATING";
  console.log("L6_UI_NAVIGATING_TO_BLANK");
  location.replace("about:blank#L6_UI_RELEASED");
}, 30000);
</script>
</body>
